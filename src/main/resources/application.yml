spring:
  application:
    name: jwt-rbac-api
  datasource:
    url: jdbc:h2:mem:security;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

security:
  jwt:
    secret: ${JWT_SECRET:local-demo-secret-change-before-production-2026}
    access-token-ttl: 15m
    refresh-token-ttl: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
